[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inline-sql"
description = "Inline SQL in any Python program, on local dataframes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["database", "sql", "language"]
authors = [
  { name = "Eric Zhang", email = "ekzhang1@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: SQL",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "duckdb>=1.4.4",
  "pandas>=1.3",
  "sqlparse>=0.4",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/ekzhang/inline-sql#readme"
Issues = "https://github.com/ekzhang/inline-sql/issues"
Source = "https://github.com/ekzhang/inline-sql"

[tool.hatch.version]
path = "inline_sql/__about__.py"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "inline_sql/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]  # variables read via stack frame introspection (sql^)
